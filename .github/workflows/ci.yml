name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # 3. Setup Python
      - name: Set up Python
        run: uv python install 3.14

      # 4. Install dependencies
      - name: Install dependencies
        run: uv sync --frozen

      # 5. Lint
      - name: Check lint
        run: uv run ruff check .

      # 6. Format
      - name: Check formatting
        run: uv run ruff format --check .

      # 7. Tests
      - name: Run tests
        run: uv run pytest

      # 8. Build Docker Image
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ci-cd-ai-service:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/ci-cd-ai-service:latest .

      # 9. Login to GHCR
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 10. Push Docker Image
      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/ci-cd-ai-service:${{ github.sha }}

          docker push \
            ghcr.io/${{ github.repository_owner }}/ci-cd-ai-service:latest

      # 12. Deploy to Staging
      - name: Deploy to Staging
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}"

  # 13. Production deployment
  deploy-production:
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      # 14. Deploy to Production
      - name: Deploy to Production
        run: |
          curl -X POST \
          "${{ secrets.RENDER_DEPLOY_HOOK_URL }}&imgURL=ghcr.io%2Fatulsingh82889-maker%2Fci-cd-ai-service%3A${{ github.sha }}"