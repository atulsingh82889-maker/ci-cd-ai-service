name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .
  
      - name: Run tests
        run: uv run pytest
        
      - name: Build Docker image
        # run: docker build -t ci-cd-ai-service .
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ci-cd-ai-service:${{ github.sha }} .


      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag ci-cd-ai-service:latest \
            ghcr.io/${{ github.repository_owner }}/ci-cd-ai-service:latest

          docker push \
            ghcr.io/${{ github.repository_owner }}/ci-cd-ai-service:latest
